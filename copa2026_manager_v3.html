<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa 2026 — POD Prompt Manager</title>
<style>
:root{--bg:#0a0a0a;--s:#141414;--s2:#1e1e1e;--bd:#2a2a2a;--bd2:#3a3a3a;--t:#f0f0f0;--t2:#888;--t3:#555;--ac:#f0c040;--ac2:#d4a820;--gr:#22c55e;--re:#ef4444;--bl:#3b82f6;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;}
header{background:var(--s);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:8px;}
.li{width:28px;height:28px;background:var(--ac);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.lt{font-size:13px;font-weight:600;}
.ls{font-size:9px;color:var(--t2);}
.hst{display:flex;gap:12px;}
.hn{font-size:14px;font-weight:700;color:var(--ac);text-align:right;}
.hl{font-size:9px;color:var(--t3);text-transform:uppercase;}
.hbtns{display:flex;align-items:center;gap:5px;}
.hbtn{background:var(--s2);border:1px solid var(--bd);color:var(--t2);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;}
.hbtn:hover,.hbtn.on{background:var(--ac);color:#000;border-color:var(--ac);}
.homebtn{font-size:13px;padding:4px 8px;}
.layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 50px);}
.sb{background:var(--s);border-right:1px solid var(--bd);overflow-y:auto;}
.sbsrch{padding:10px 10px 6px;}
.sbsrch input{width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--t);padding:6px 8px;border-radius:6px;font-size:11px;outline:none;}
.sbsrch input:focus{border-color:var(--ac);}
.sblbl{padding:5px 10px 2px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;}
.si{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;border-left:3px solid transparent;}
.si:hover{background:var(--s2);}
.si.on{background:rgba(240,192,64,.07);border-left-color:var(--ac);}
.sif{font-size:15px;width:20px;text-align:center;}
.sin{font-size:11px;font-weight:500;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sia{font-size:10px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sic{font-size:10px;color:var(--t3);flex-shrink:0;}
.cb{font-size:8px;background:var(--ac);color:#000;padding:1px 3px;border-radius:2px;font-weight:700;margin-left:2px;}
.main{overflow-y:auto;padding:16px;}
.dhdr{margin-bottom:12px;}
.stitle{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;}
.smeta{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap;}
.mt{font-size:10px;background:var(--s2);border:1px solid var(--bd);color:var(--t2);padding:2px 8px;border-radius:12px;}
.mt.g{background:rgba(240,192,64,.1);border-color:var(--ac2);color:var(--ac);}
.mt.v{background:rgba(34,197,94,.08);border-color:#166534;color:var(--gr);}
.sf{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 8px;}
.fb{background:var(--s2);border:1px solid var(--bd);color:var(--t2);padding:4px 10px;border-radius:12px;cursor:pointer;font-size:10px;font-weight:500;}
.fb:hover{color:var(--t);}
.fb.on{background:rgba(240,192,64,.1);border-color:var(--ac);color:var(--ac);}
.addbtn{background:rgba(34,197,94,.08);border:1px solid #166534;color:var(--gr);padding:4px 12px;border-radius:12px;cursor:pointer;font-size:10px;font-weight:600;margin-bottom:10px;}
.addf{background:var(--s);border:1px solid var(--ac2);border-radius:8px;padding:12px;margin-bottom:12px;display:none;}
.addf.open{display:block;}
.addf h4{font-size:11px;font-weight:600;color:var(--ac);margin-bottom:8px;}
.addf input,.addf textarea{width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--t);padding:6px 8px;border-radius:5px;font-size:11px;outline:none;margin-bottom:6px;font-family:inherit;}
.addf textarea{resize:vertical;min-height:60px;}
.addf input:focus,.addf textarea:focus{border-color:var(--ac);}
.adfb{display:flex;gap:6px;}
.bsv{background:var(--ac);color:#000;padding:5px 14px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;border:none;}
.bcn{background:var(--s2);color:var(--t2);padding:5px 10px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid var(--bd);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
.pc{background:var(--s);border:1px solid var(--bd);border-radius:8px;overflow:hidden;}
.pc:hover{border-color:var(--bd2);}
.pc.used{border-color:#166534;opacity:.6;}
.pch{padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);}
.pcn{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.pcb{display:flex;align-items:center;gap:5px;}
.ubadge{font-size:8px;background:rgba(34,197,94,.12);border:1px solid #166534;color:var(--gr);padding:1px 5px;border-radius:8px;}
.pcnum{font-size:9px;color:var(--t3);}
.pcbody{padding:8px 12px;}
.ptxt{font-size:11px;color:var(--t2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.pedit{width:100%;background:var(--s2);border:1px solid var(--ac);color:var(--t);padding:6px;border-radius:5px;font-size:11px;line-height:1.5;resize:vertical;min-height:70px;outline:none;font-family:inherit;display:none;}
.pcf{padding:7px 12px;display:flex;gap:5px;border-top:1px solid var(--bd);flex-wrap:wrap;}
.btn{padding:4px 9px;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;border:none;}
.bcp{background:var(--s2);color:var(--t2);border:1px solid var(--bd);flex:1;}
.bcp:hover{background:var(--bd);color:var(--t);}
.bcp.ok{background:rgba(34,197,94,.1);border-color:var(--gr);color:var(--gr);}
.bed{background:var(--s2);color:var(--bl);border:1px solid var(--bd);}
.bsave{background:rgba(59,130,246,.12);color:var(--bl);border:1px solid var(--bl);display:none;}
.bex{background:var(--ac);color:#000;font-weight:700;}
.bex:hover{background:var(--ac2);}
.busedtgl{font-size:9px;padding:4px 7px;background:var(--s2);color:var(--t3);border:1px solid var(--bd);}
.busedtgl.on{background:rgba(34,197,94,.1);color:var(--gr);border-color:#166534;}
.sm{display:none;padding:20px;max-width:820px;margin:0 auto;}
.sm.vis{display:block;}
.dm.hid{display:none;}
.sprog{margin-bottom:16px;}
.sproginfo{display:flex;justify-content:space-between;margin-bottom:5px;}
.sbar{height:3px;background:var(--s2);border-radius:2px;overflow:hidden;}
.sfill{height:100%;background:var(--ac);border-radius:2px;transition:width .3s;}
.scard{background:var(--s);border:1px solid var(--ac2);border-radius:10px;overflow:hidden;}
.schdr{padding:12px 16px;background:rgba(240,192,64,.04);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.scfl{display:flex;align-items:center;gap:8px;}
.scflag{font-size:22px;}
.scnm{font-size:16px;font-weight:700;}
.scap{font-size:11px;color:var(--t2);}
.scsb{font-size:9px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);}
.scbody{padding:16px;}
.splbl{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.bigp{background:var(--s2);border:1px solid var(--bd2);border-radius:7px;padding:14px;font-size:12px;color:#d4d4d4;line-height:1.8;font-family:'Courier New',monospace;white-space:pre-wrap;word-break:break-word;min-height:140px;max-height:340px;overflow-y:auto;cursor:text;user-select:all;}
.bigp:focus{outline:2px solid var(--ac);}
.scact{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center;}
.bprev{background:var(--s2);color:var(--t2);border:1px solid var(--bd);padding:7px 12px;border-radius:7px;font-size:11px;cursor:pointer;}
.bcpbig{background:var(--s2);color:var(--t);border:1px solid var(--bd2);padding:7px 14px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;flex:1;}
.bcpbig.ok{background:rgba(34,197,94,.1);border-color:var(--gr);color:var(--gr);}
.bmu{padding:7px 10px;border-radius:7px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--s2);color:var(--t3);}
.bmu.on{background:rgba(34,197,94,.1);border-color:#166534;color:var(--gr);}
.bnxt{background:var(--ac);color:#000;border:none;padding:7px 18px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;}
.bnxt:hover{background:var(--ac2);}
.bnxt:disabled,.bprev:disabled{opacity:.3;cursor:not-allowed;}
.empty{text-align:center;padding:40px;color:var(--t3);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
@media(max-width:700px){.layout{grid-template-columns:1fr;}.sb{max-height:260px;}.hst{display:none;}}
</style>
</head>

<div id="top"></div>
<header>
  <div class="logo">

  </div>

    <div><div class="hn" id="uc">0</div><div class="hl">Usados</div></div>
  </div>
  <div class="hbtns">
    <button class="hbtn homebtn" onclick="goHome()" title="Topo">🏠</button>
    <button class="hbtn on" onclick="setMode('d')" id="bd">Dashboard</button>
    <button class="hbtn" onclick="setMode('s')" id="bs">Sequencial</button>
  </div>
</header>
<div class="layout">
<div class="sb">
  <div class="sbsrch"><input type="text" placeholder="Buscar seleção..." id="srch" oninput="fSel()"></div>
  <div class="sblbl">Campeãs do Mundo</div>
  <div id="sbc"></div>
  <div class="sblbl">Demais Seleções</div>
  <div id="sbo"></div>
</div>
<div class="main dm" id="dm">
  <div id="dh"><div class="empty">👈 Selecione uma seleção para ver os prompts</div></div>
  <div class="sf" id="sf" style="display:none"></div>
  <button class="addbtn" id="ab" style="display:none" onclick="togAdd()">+ Adicionar Prompt</button>
  <div class="addf" id="af">
    <h4>Novo Prompt Personalizado</h4>
    <input type="text" id="nfn" placeholder="Nome do estilo (ex: Aquarela / Festival)">
    <textarea id="nfp" placeholder="Cole ou escreva o prompt completo aqui..."></textarea>
    <div class="adfb">
      <button class="bsv" onclick="saveNew()">💾 Salvar</button>
      <button class="bcn" onclick="togAdd()">Cancelar</button>
    </div>
  </div>
  <div class="grid" id="gr"></div>
</div>
<div class="sm" id="sm">
  <div class="sprog">
    <div class="sproginfo">
      <span style="font-size:11px;color:var(--t2)" id="sc">Prompt 1</span>
      <span style="font-size:11px;font-weight:700;color:var(--ac)" id="sp">0%</span>
    </div>
    <div class="sbar"><div class="sfill" id="sf2" style="width:0%"></div></div>
  </div>
  <div class="scard">
    <div class="schdr">
      <div class="scfl">
        <span class="scflag" id="sfg">⚽</span>
        <div><div class="scnm" id="snm">—</div><div class="scap" id="sap">—</div></div>
      </div>
      <div class="scsb" id="ssb">—</div>
    </div>
    <div class="scbody">
      <div class="splbl">Prompt — clique para selecionar tudo</div>
      <div class="bigp" id="bp" tabindex="0" onclick="this.focus();document.execCommand('selectAll')" title="Clique para selecionar tudo">—</div>
    </div>
    <div class="scact">
      <button class="bprev" onclick="smv(-1)" id="bpv">← Ant.</button>
      <button class="bcpbig" onclick="cpB()" id="bcb">📋 Copiar Prompt</button>
      <button class="bmu" onclick="togUsedS()" id="bmu">✓ Marcar Usado</button>
      <button class="bnxt" onclick="smv(1)" id="bnx">Próx. →</button>
    </div>
  </div>
</div>
</div>

// FUNÇÕES
function getU(){try{return JSON.parse(localStorage.getItem('pod_u')||'{}');}catch{return{};}}
function setU(u){localStorage.setItem('pod_u',JSON.stringify(u));}
function isU(id){return!!getU()[id];}
function togU(id){const u=getU();u[id]?delete u[id]:u[id]=1;setU(u);updUC();}
function updUC(){document.getElementById('uc').textContent=Object.keys(getU()).length;}
function aP(s){return[...(s.p||[]),...(s.custom||[])];}
function buildSB(){
  const ch=Object.values(D).filter(s=>s.camp);
  const ot=Object.values(D).filter(s=>!s.camp);
  document.getElementById('sbc').innerHTML=ch.map(siEl).join('');
  document.getElementById('sbo').innerHTML=ot.map(siEl).join('');
  document.getElementById('tp').textContent=Object.values(D).reduce((a,s)=>a+aP(s).length,0);
  updUC();
}
function siEl(s){const tp=aP(s).length;return`<div class="si" id="si-${s.id}" onclick="selSel('${s.id}')"><span class="sif">${s.flag}</span><div class="si-info"><div class="sin">${s.nome}${s.camp?`<span class="cb">${s.tn}x</span>`:''}</div><div class="sia">${s.ap}</div></div><span class="sic">${tp}</span></div>`;}
function selSel(id){
  document.querySelectorAll('.si').forEach(e=>e.classList.remove('on'));
  const el=document.getElementById('si-'+id);
  if(el){el.classList.add('on');el.scrollIntoView({block:'nearest'});}
  cur=id;renderDash();
}
function renderDash(){
  if(!cur)return;
  const s=D[cur];
  document.getElementById('dh').innerHTML=`<div class="stitle"><span>${s.flag}</span>${s.nome}</div><div class="smeta"><span class="mt">${s.ap}</span><span class="mt">📍 ${s.cid}</span>${s.camp?`<span class="mt g">★ ${s.tit}</span>`:''}<span class="mt v">${aP(s).length} prompts</span></div>`;
  const sf=document.getElementById('sf');sf.style.display='flex';
  sf.innerHTML=`<button class="fb${sfilt==='all'?' on':''}" onclick="setSF('all',this)">Todos</button>${[...new Set(aP(s).map(p=>p[0]))].map(e=>`<button class="fb${sfilt===e?' on':''}" onclick="setSF(${e},this)" style="color:${EC[e]||'#888'}">${aP(s).find(p=>p[0]===e)?.[1]||'#'+e}</button>`).join('')}`;
  document.getElementById('ab').style.display='';
  renderGrid();
}
function setSF(v,btn){sfilt=v;document.querySelectorAll('#sf .fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderGrid();}
function renderGrid(){
  if(!cur)return;
  const s=D[cur];
  const all=aP(s);
  const filtered=sfilt==='all'?all:all.filter(p=>p[0]===sfilt);
  document.getElementById('gr').innerHTML=filtered.map(p=>{
    const uid=cur+'_'+p[0]+'_'+p[1].replace(/\W/g,'');
    const used=isU(uid);
    return`<div class="pc${used?' used':''}" id="pc-${uid}"><div class="pch"><span class="pcn" style="color:${EC[p[0]]||'#888'}">${p[1]}</span><div class="pcb">${used?'<span class="ubadge">✓ usado</span>':''}<span class="pcnum">#${p[0]}</span></div></div><div class="pcbody"><div class="ptxt" id="pt-${uid}">${p[2]}</div><textarea class="pedit" id="pe-${uid}">${p[2]}</textarea></div><div class="pcf"><button class="btn bcp" onclick="cp(this,'${uid}')">📋 Copiar</button><button class="btn bed" id="bed-${uid}" onclick="togEd('${uid}')">✏️ Editar</button><button class="btn bsave" id="bsv-${uid}" onclick="saveEd('${cur}',${p[0]},'${p[1].replace(/'/g,"\\'")}','${uid}')">💾 Salvar</button><button class="btn bex" onclick="execP(${p[0]},'${p[1].replace(/'/g,"\\'")}')">▶</button><button class="btn busedtgl ${used?'on':''}" onclick="togUsedCard('${uid}',this)">${used?'✓ Usado':'Marcar'}</button></div></div>`;
  }).join('');
}
function cp(btn,uid){
  const t=document.getElementById('pt-'+uid)?.textContent||'';
  navigator.clipboard.writeText(t).then(()=>{btn.textContent='✓ Copiado!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='📋 Copiar';btn.classList.remove('ok');},2000);});
}
function togEd(uid){
  const pt=document.getElementById('pt-'+uid);
  const pe=document.getElementById('pe-'+uid);
  const bed=document.getElementById('bed-'+uid);
  const bsv=document.getElementById('bsv-'+uid);
  const editing=pe.style.display==='block';
  pt.style.display=editing?'':undefined;
  if(editing)pt.removeAttribute('style');else pt.style.display='none';
  pe.style.display=editing?'none':'block';
  bed.textContent=editing?'✏️ Editar':'✏️ Cancelar';
  bsv.style.display=editing?'none':'inline-block';
}
function saveEd(selId,ei,eName,uid){
  const s=D[selId];
  const newTxt=document.getElementById('pe-'+uid).value;
  const p=aP(s).find(x=>x[0]===ei&&x[1]===eName);
  if(p)p[2]=newTxt;
  document.getElementById('pt-'+uid).textContent=newTxt;
  togEd(uid);
}
function togUsedCard(uid,btn){
  togU(uid);const used=isU(uid);
  btn.textContent=used?'✓ Usado':'Marcar';btn.classList.toggle('on',used);
  document.getElementById('pc-'+uid)?.classList.toggle('used',used);
  const cb=document.querySelector(`#pc-${uid} .pcb`);
  const ub=document.querySelector(`#pc-${uid} .ubadge`);
  if(used&&!ub&&cb){const sp=document.createElement('span');sp.className='ubadge';sp.textContent='✓ usado';cb.prepend(sp);}
  else if(!used&&ub)ub.remove();
}
function togAdd(){const f=document.getElementById('af');f.classList.toggle('open');if(f.classList.contains('open')){document.getElementById('nfn').value='';document.getElementById('nfp').value='';}}
function saveNew(){
  if(!cur)return;
  const nome=document.getElementById('nfn').value.trim();
  const prompt=document.getElementById('nfp').value.trim();
  if(!nome||!prompt){alert('Preencha nome e prompt!');return;}
  const s=D[cur];if(!s.custom)s.custom=[];
  const ei=100+s.custom.length;
  s.custom.push([ei,nome,prompt]);
  localStorage.setItem('cp_'+cur,JSON.stringify(s.custom));
  togAdd();renderDash();
}
function execP(ei,nome){
  if(!cur)return;
  setMode('s');buildSeqList();
  const idx=seqL.findIndex(x=>x.sel===cur&&x.p[0]===ei&&x.p[1]===nome);
  if(idx>=0){seqI=idx;renderSeq();}
}
function buildSeqList(){seqL=[];Object.values(D).forEach(s=>aP(s).forEach(p=>seqL.push({sel:s.id,p})));return seqL;}
function renderSeq(){
  if(!seqL.length)buildSeqList();
  const item=seqL[seqI];if(!item)return;
  const s=D[item.sel];const p=item.p;
  const tot=seqL.length;const pct=Math.round((seqI/tot)*100);
  document.getElementById('sc').textContent=`Prompt ${seqI+1} de ${tot}`;
  document.getElementById('sp').textContent=pct+'%';
  document.getElementById('sf2').style.width=pct+'%';
  document.getElementById('sfg').textContent=s.flag;
  document.getElementById('snm').textContent=s.nome;
  document.getElementById('sap').textContent=s.ap;
  document.getElementById('ssb').textContent=`${p[0]}. ${p[1]}`;
  document.getElementById('bp').textContent=p[2];
  const uid=item.sel+'_'+p[0]+'_'+p[1].replace(/\W/g,'');
  const used=isU(uid);
  document.getElementById('bmu').classList.toggle('on',used);
  document.getElementById('bmu').textContent=used?'✓ Usado':'✓ Marcar Usado';
  document.getElementById('bpv').disabled=seqI===0;
  document.getElementById('bnx').disabled=seqI===tot-1;
  document.getElementById('bcb').textContent='📋 Copiar Prompt';
  document.getElementById('bcb').classList.remove('ok');
}
function smv(d){seqI=Math.max(0,Math.min(seqL.length-1,seqI+d));renderSeq();}
function cpB(){
  const t=document.getElementById('bp').textContent;
  navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById('bcb');b.textContent='✓ Copiado!';b.classList.add('ok');setTimeout(()=>{b.textContent='📋 Copiar Prompt';b.classList.remove('ok');},2500);});
}
function togUsedS(){
  const item=seqL[seqI];if(!item)return;
  const uid=item.sel+'_'+item.p[0]+'_'+item.p[1].replace(/\W/g,'');
  togU(uid);const used=isU(uid);
  document.getElementById('bmu').classList.toggle('on',used);
  document.getElementById('bmu').textContent=used?'✓ Usado':'✓ Marcar Usado';
}
function setMode(m){
  mode=m;
  document.getElementById('bd').classList.toggle('on',m==='d');
  document.getElementById('bs').classList.toggle('on',m==='s');
  document.getElementById('dm').classList.toggle('hid',m==='s');
  document.getElementById('sm').classList.toggle('vis',m==='s');
  if(m==='s'){buildSeqList();renderSeq();}
}
function goHome(){window.scrollTo({top:0,behavior:'smooth'});}
function fSel(){
  const q=document.getElementById('srch').value.toLowerCase();
  Object.keys(D).forEach(id=>{const el=document.getElementById('si-'+id);if(el)el.style.display=(D[id].nome.toLowerCase().includes(q)||D[id].ap.toLowerCase().includes(q))?'':'none';});
}
buildSB();
